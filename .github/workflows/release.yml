name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tests:
    name: BoxLang ${{ matrix.boxlang-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - latest
          - snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: box run-script test

      - name: Verify installed consumer and BIFs
        shell: bash
        run: |
          consumer_dir="${RUNNER_TEMP}/bx-mustache-consumer"
          export BOXLANG_HOME="${consumer_dir}/.boxlang"
          mkdir -p "${consumer_dir}/boxlang_modules"
          cp tests/consumer/*.bx tests/consumer/*.json "${consumer_dir}/"
          cd "${consumer_dir}"
          box install "${GITHUB_WORKSPACE}" --directory="boxlang_modules" --production --save=false
          boxlang --bx-config boxlang.json Smoke.bx
          boxlang --bx-config boxlang.json Settings.bx
          MUSTACHE_EXPECT_CACHE_ENABLED=true MUSTACHE_EXPECT_CACHE_MAX_ENTRIES=2 boxlang --bx-config cache-enabled.json Settings.bx
          MUSTACHE_EXPECT_CACHE_ENABLED=false MUSTACHE_EXPECT_CACHE_MAX_ENTRIES=3 boxlang --bx-config cache-disabled.json Settings.bx

      - name: Inspect package metadata
        run: box package show

  publish:
    name: Tag and publish
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and validate release version
        id: release
        shell: bash
        run: |
          VERSION="$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$"))' box.json)"
          MODULE_VERSION="$(sed -n 's/.*this\.version *= *"\([^"]*\)".*/\1/p' ModuleConfig.bx)"

          if [[ "$VERSION" != "$MODULE_VERSION" ]]; then
            echo "box.json version ($VERSION) does not match ModuleConfig.bx ($MODULE_VERSION)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require release credentials
        env:
          FORGEBOX_TOKEN: ${{ secrets.FORGEBOX_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$FORGEBOX_TOKEN" ]]; then
            echo "Add a FORGEBOX_TOKEN repository secret before releasing." >&2
            exit 1
          fi

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          forgeboxAPIKey: ${{ secrets.FORGEBOX_TOKEN }}

      - name: Tag release commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $TAG_COMMIT; refusing to move it to $GITHUB_SHA." >&2
              exit 1
            fi
            echo "$TAG already points to this commit; continuing the release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish to ForgeBox
        run: box forgebox publish --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$VERSION" --generate-notes
          fi
