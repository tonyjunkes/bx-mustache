name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: BoxLang ${{ matrix.boxlang-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        boxlang-version:
          - latest
          - snapshot

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: ${{ matrix.boxlang-version }}
          with-commandbox: true

      - name: Install development dependencies
        run: box install

      - name: Run TestBox
        run: box run-script test

      - name: Verify installed consumer and BIFs
        shell: bash
        run: |
          consumer_dir="${RUNNER_TEMP}/bx-mustache-consumer"
          export BOXLANG_HOME="${consumer_dir}/.boxlang"
          mkdir -p "${consumer_dir}/boxlang_modules"
          cp tests/consumer/Smoke.bx tests/consumer/boxlang.json "${consumer_dir}/"
          cd "${consumer_dir}"
          box install "${GITHUB_WORKSPACE}" --directory="boxlang_modules" --production --save=false
          boxlang --bx-config boxlang.json Smoke.bx

      - name: Inspect package metadata
        run: box package show
